# Enable HTTPS trading inside the existing market container. OpenD stays external.
services:
  market:
    init: true
    environment:
      TRADING_DATA_DIR: /trade-data
      MARKET_INTERNAL_URL: http://127.0.0.1:8000
    entrypoint: ["python3", "-m", "app.launch"]
    ports:
      - "${TRADING_BIND:-127.0.0.1}:${TRADING_PORT:-8443}:8443"
    volumes:
      - ./trade-data:/trade-data
      - ./trade-tls:/tls:ro
    mem_limit: 640m
    cpus: 1.5
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python3", "-m", "app.health"]
      interval: 30s
      timeout: 8s
      retries: 3
