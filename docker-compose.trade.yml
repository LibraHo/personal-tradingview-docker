# Start together with the normal compose file; OpenD is reused, never restarted.
services:
  trading:
    build:
      context: .
      dockerfile: Dockerfile.nas
    restart: unless-stopped
    env_file: .env
    environment:
      TRADING_DATA_DIR: /trade-data
    entrypoint: ["python3", "-m", "uvicorn", "app.trade_api:app", "--host", "0.0.0.0", "--port", "8443", "--workers", "1", "--no-proxy-headers", "--ssl-keyfile", "/tls/key.pem", "--ssl-certfile", "/tls/cert.pem", "--no-access-log"]
    networks: [opend]
    ports:
      - "${TRADING_BIND:-127.0.0.1}:${TRADING_PORT:-8443}:8443"
    volumes:
      - ./trade-data:/trade-data
      - ./trade-tls:/tls:ro
      - ${OPEND_RSA_SOURCE}:/run/secrets/opend_rsa.pem:ro
    mem_limit: 320m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8443/health', context=ssl._create_unverified_context(), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
